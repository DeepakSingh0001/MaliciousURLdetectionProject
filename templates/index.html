<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL Safety Checker</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            text-align: center;
            padding: 50px;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            width: 50%;
            margin: auto;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
        }
        input {
            width: 80%;
            padding: 10px;
            margin: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            background-color: #28a745;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #218838;
        }
        .result {
            margin-top: 20px;
            font-size: 18px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>URL Safety Checker</h2>
        <form action="/predict" method="post">
            <input type="text" name="url" placeholder="Enter a URL..." required>
            <button type="submit">Check</button>
        </form>

        {% if url %}
        <div class="result">
            <p><strong>URL:</strong> {{ url }}</p>
            <p><strong>CNN Prediction:</strong> {{ cnn }}</p>
            <p><strong>Random Forest Prediction:</strong> {{ rf }}</p>
            <p><strong>Logistic Regression Prediction:</strong> {{ lr }}</p>
        </div>
        {% endif %}
    </div>

</body>
</html>
